name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Configure npm auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prep npm release by restoring @afterlink scope and removing root .npmrc
        run: |
          node scripts/prepare-npm-publish.js
          rm -f .npmrc

      - name: Diagnose npm OIDC trusted publishing
        continue-on-error: true
        run: |
          echo "npm: $(npm --version) / pnpm: $(pnpm --version) / node: $(node --version)"
          ID_TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | python3 -c "import sys, json; print(json.load(sys.stdin).get('value', ''))")
          echo "id_token length: ${#ID_TOKEN}"
          echo "== OIDC token claims =="
          python3 -c "import base64, json, sys; t = sys.argv[1].split('.')[1]; print(json.dumps(json.loads(base64.urlsafe_b64decode(t + '=' * (-len(t) % 4))), indent=2))" "$ID_TOKEN"
          echo "== registry token-exchange probe (one per package) =="
          for pkg in afterlink @afterlink/ai-assistant @afterlink/browser @afterlink/cli @afterlink/client @afterlink/cluster @afterlink/core @afterlink/server; do
            ESC=$(printf '%s' "$pkg" | sed 's|/|%2f|')
            CODE=$(curl -s -o /tmp/exchange_body -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" -H "Accept: application/json" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESC")
            echo "exchange $pkg -> HTTP $CODE :: $(head -c 300 /tmp/exchange_body)"
          done

      - name: Publish packages
        run: pnpm -r publish --access public --no-git-checks --provenance --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Notify Discord on success
        if: success() && env.DISCORD_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚀 AfterLink ${{ github.event.release.tag_name || github.ref_name }} Published",
                "description": "New release published to npm: ${{ github.event.release.html_url }}",
                "color": 5763719,
                "footer": {
                  "text": "AfterLink CI"
                }
              }]
            }'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
